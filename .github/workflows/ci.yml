name: ci

on:
  push:
  pull_request:

jobs:
  build-test-pack:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      DiffEngine_Disabled: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore DotNetCompose.sln
      - run: dotnet build DotNetCompose.sln -c Release --no-restore
      - run: dotnet test DotNetCompose.sln -c Release --no-build --no-restore
